<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Game_3D_Run</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true,viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <!-- 样式直接写在页面里，避免部署后浏览器缓存旧的 style.css 导致样式和页面对不上 -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        cursor: default;
        font-family: Helvetica, Verdana, Arial, sans-serif;
      }

      body, canvas, div {
        outline: none;
        -moz-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        -khtml-user-select: none;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      canvas {
        background-color: rgba(0, 0, 0, 0);
      }

      /* 铺满整个浏览器窗口，去掉默认模板的黑边框和阴影 */
      #GameDiv {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      #Cocos3dGameContainer, #GameCanvas {
        width: 100%;
        height: 100%;
      }

      /* 首次打开要下载 ~9MB 的引擎和资源，这段时间画面是黑的，
         所以先铺一层纯 HTML 的加载提示（不依赖任何脚本，打开就能看到），
         等引擎把场景跑起来再淡出收掉 */
      #Loading {
        position: fixed;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 38%, #1b3353 0%, #0a1322 62%, #05080f 100%);
        color: #eaf4ff;
        transition: opacity 0.45s ease;
      }

      #Loading.hide {
        opacity: 0;
        pointer-events: none;
      }

      #Loading .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid rgba(255, 255, 255, 0.16);
        border-top-color: #7fd0ff;
        border-radius: 50%;
        animation: loading-spin 0.9s linear infinite;
      }

      @keyframes loading-spin {
        to { transform: rotate(360deg); }
      }

      #Loading .title {
        margin-top: 20px;
        font-size: 18px;
        letter-spacing: 3px;
      }

      #LoadingStage {
        margin-top: 8px;
        font-size: 13px;
        color: #8fa8c4;
      }

      #Loading .bar {
        margin-top: 20px;
        width: 260px;
        max-width: 60vw;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }

      #LoadingFill {
        display: block;
        width: 0;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #3f9bff, #9fe3ff);
        transition: width 0.5s ease;
      }

      /* 等得久了才淡入的那行小字 */
      #LoadingHint {
        margin-top: 16px;
        font-size: 12px;
        line-height: 1.6;
        text-align: center;
        color: #5f738c;
        opacity: 0;
        transition: opacity 0.8s ease;
      }
    </style>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>
    <!-- 注意：引擎 3.8.8 不读这个 cc_exact_fit_screen 属性，真正生效的是同目录 application.js 里的
         overrideSettings.screen.exactFitScreen = true（让引擎跟随窗口大小重建画布）。属性保留只是为了和官方模板一致 -->
    <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" tabindex="99"></canvas>
      </div>
    </div>

    <div id="Loading">
      <div class="spinner"></div>
      <div class="title">加载中…</div>
      <div id="LoadingStage">正在准备</div>
      <div class="bar"><i id="LoadingFill"></i></div>
      <div id="LoadingHint">首次打开需要下载约 9MB 的游戏文件<br>请保持网络连接，稍等一会儿</div>
    </div>

    <script>
      // 加载提示的开关。进度条是按「下载引擎 / 启动引擎 / 加载资源」几个阶段推进的，
      // 不是真实的字节百分比（浏览器拿不到 SystemJS 的下载进度），所以只画条不写数字
      window.__loading = (function () {
        var root = document.getElementById('Loading');
        var stage = document.getElementById('LoadingStage');
        var fill = document.getElementById('LoadingFill');
        var hint = document.getElementById('LoadingHint');
        var finished = false;
        var percent = 0;
        // 8 秒还没好就提示一下要下载多少东西，免得以为卡死了
        var hintTimer = setTimeout(function () { hint.style.opacity = '1'; }, 8000);

        function step (p, text) {
          if (finished) return;
          if (p > percent) {
            percent = p;
            fill.style.width = p + '%';
          }
          if (text) stage.textContent = text;
        }

        function hide () {
          if (finished) return;
          finished = true;
          clearTimeout(hintTimer);
          fill.style.width = '100%';
          root.className = 'hide';
          // 淡出完再从页面里删掉，省得它挡着触摸事件
          setTimeout(function () {
            if (root.parentNode) root.parentNode.removeChild(root);
          }, 600);
        }

        function fail (err) {
          if (finished) return;
          console.error(err);
          clearTimeout(hintTimer);
          stage.textContent = '加载失败，请检查网络后刷新页面';
          stage.style.color = '#ff9b9b';
          hint.style.opacity = '1';
        }

        return { step: step, hide: hide, fail: fail };
      })();
    </script>

<!-- Polyfills bundle. -->
<script src="src/polyfills.bundle.js" charset="utf-8"> </script>

<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    (function () {
      var loading = window.__loading;
      loading.step(8, '正在下载游戏引擎…');

      // 这里先自己 import 一次 cc：和 index.js 里的是同一个地址，SystemJS 会复用同一个请求，
      // 不会多下一遍，只是为了知道 3MB 的引擎什么时候下完，好推进度条
      System.import('cc').then(function (cc) {
        loading.step(60, '正在启动引擎…');
        try {
          cc.game.once(cc.Game.EVENT_GAME_INITED, function () {
            loading.step(80, '正在加载游戏资源…');
          });
          cc.director.once(cc.Director.EVENT_AFTER_SCENE_LAUNCH, function () {
            loading.step(100);
            setTimeout(loading.hide, 100);
          });
        } catch (e) {
          console.warn(e);
        }
        // 兜底：万一上面的事件名对不上（换引擎版本），轮询到场景跑起来也收掉遮罩
        var timer = setInterval(function () {
          if (cc.director && cc.director.getScene()) {
            clearInterval(timer);
            loading.hide();
          }
        }, 200);
      }).catch(function (err) { loading.fail(err); });

      System.import('./index.js').catch(function (err) { loading.fail(err); });
    })();
</script>
  </body>
</html>
