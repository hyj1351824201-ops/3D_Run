<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

    <title>Game_3D</title>

    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,minimal-ui=true"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="yes"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <!-- 样式直接写在页面里，避免部署后浏览器缓存旧的 style.css 导致样式和页面对不上 -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        cursor: default;
        font-family: Helvetica, Verdana, Arial, sans-serif;
      }

      body, canvas, div {
        outline: none;
        -moz-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        -khtml-user-select: none;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      canvas {
        background-color: rgba(0, 0, 0, 0);
      }

      /* 铺满整个浏览器窗口，去掉默认模板的黑边框和阴影 */
      #GameDiv {
        position: absolute;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      #Cocos3dGameContainer, #GameCanvas {
        width: 100%;
        height: 100%;
      }
    </style>
    <link rel="icon" href="favicon.ico"/>
  </head>
  <body>
    <!-- cc_exact_fit_screen="true" 让引擎用浏览器窗口大小当画布大小，并监听 resize，和 web-mobile 模板一致 -->
    <div id="GameDiv" cc_exact_fit_screen="true">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" tabindex="99"></canvas>
      </div>
    </div>

<!-- Polyfills bundle. -->
<script src="src/polyfills.bundle.js" charset="utf-8"> </script>

<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>
  </body>
</html>
